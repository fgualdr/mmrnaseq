report_comment: >
  This report has been generated by the <a href="https://github.com/fgualdr/mmrnaseq" target="_blank">fgualdr/mmrnaseq</a>
  analysis pipeline. Multimapper QC is fragment-level; BAM alignment-record counts are labelled explicitly.

no_version_check: true

# PATCH07 corrected report order. MultiQC appends modules absent from module_order
# at the top, so every active standard module is listed explicitly. Custom-content
# sections are then interleaved with report_section_order using their real anchors.
module_order:
  - custom_content
  - fastqc:
      name: "FastQC (raw)"
      anchor: "fastqc_raw"
      info: "FastQC before adapter trimming. Mate-level results are retained here but suppressed from sample-level General Statistics."
      generalstats: false
      path_filters:
        - "./fastqc/raw/*.zip"
  - cutadapt
  - fastp
  - fastqc:
      name: "FastQC (trimmed)"
      anchor: "fastqc_trimmed"
      info: "FastQC after adapter trimming. Mate-level results are retained here but suppressed from sample-level General Statistics."
      generalstats: false
      path_filters:
        - "./fastqc/trim/*.zip"
  - sortmerna
  - star
  - samtools
  - rseqc
  - qualimap
  - preseq
  - picard
  - salmon

report_section_order:
  # Pipeline context and actual QC warnings first.
  fgualdr-mmrnaseq-summary:
    order: 2000
  fail_trimmed_samples:
    order: 1950
  fail_mapped_samples:
    order: 1940
  strand_qc:
    order: 1930

  # Input / trimming QC.
  fastqc_raw:
    order: 1800
  cutadapt:
    order: 1770
  fastp:
    order: 1760
  fastqc_trimmed:
    order: 1750
  sortmerna:
    order: 1700

  # Alignment followed by multimapper inference.
  star:
    order: 1600
  mm_fragment_usability:
    order: 1550
  mmresolver:
    order: 1540
  mmdensity:
    order: 1530

  # Final quantitative-BAM QC.
  samtools:
    order: 1400
  rseqc:
    order: 1390
  qualimap:
    order: 1380
  preseq:
    order: 1370
  picard:
    order: 1360

  # Expression / sample-level diagnostics.
  salmon:
    order: 1250
  dupradar:
    order: 1200
  biotype_counts:
    order: 1190
  custom_counts_deseq2_pca:
    order: 1180
  custom_counts_deseq2_clustering:
    order: 1170

  # Documentation / provenance last.
  nf-core-mmrnaseq-methods-description:
    order: -900
  multiqc_software_versions:
    order: -990
  software_versions:
    order: -1000

# RSeQC subsection order: start with basic BAM/reference compatibility and
# strandedness, then feature- and splice-level diagnostics.
rseqc_sections:
  - bam_stat
  - infer_experiment
  - read_distribution
  - inner_distance
  - junction_annotation
  - junction_saturation
  - read_duplication
  - tin

# Static plots are a PATCH07 deliverable. The process additionally validates
# that at least one PNG/SVG/PDF was actually produced.
export_plots: true
export_plot_formats:
  - png
  - svg
  - pdf
export_plots_timeout: 300

# Only active modules in the cleaned STAR/Salmon workflow.
run_modules:
  - custom_content
  - fastqc
  - cutadapt
  - fastp
  - sortmerna
  - star
  - salmon
  - samtools
  - picard
  - preseq
  - rseqc
  - qualimap

# Duplicate percentage is not promoted from FastQC; duplicate handling is reported
# separately and coordinate-based Picard marking is disabled before MM realization.
table_columns_visible:
  fastqc:
    percent_duplicates: false

extra_fn_clean_exts:
  - ".umi_dedup"
  - "_val"
  - ".markdup"
  - ".mm.quantitative.sorted"

sp:
  cutadapt:
    fn: "*trimming_report.txt"

  fastp:
    fn: "*.fastp.json"

  sortmerna:
    fn: "*.sortmerna.log"

  salmon/meta:
    fn: "meta_info.json"

  preseq:
    fn: "*.lc_extrap.txt"

  samtools/stats:
    fn: "*.stats"
  samtools/flagstat:
    fn: "*.flagstat"
  samtools/idxstats:
    fn: "*.idxstats*"

  rseqc/bam_stat:
    fn: "*.bam_stat.txt"
  rseqc/gene_body_coverage:
    skip: true
  rseqc/junction_annotation:
    fn: "*.junction_annotation.log"
  rseqc/read_gc:
    skip: true
  rseqc/read_distribution:
    fn: "*.read_distribution.txt"
  rseqc/infer_experiment:
    fn: "*.infer_experiment.txt"
  rseqc/tin:
    fn: "*.summary.txt"

  picard/markdups:
    fn: "*.MarkDuplicates.metrics.txt"
  picard/alignment_metrics:
    skip: true
  picard/basedistributionbycycle:
    skip: true
  picard/gcbias:
    skip: true
  picard/hsmetrics:
    skip: true
  picard/insertsize:
    skip: true
  picard/oxogmetrics:
    skip: true
  picard/pcr_metrics:
    skip: true
  picard/quality_by_cycle:
    skip: true
  picard/quality_score_distribution:
    skip: true
  picard/quality_yield_metrics:
    skip: true
  picard/rnaseqmetrics:
    skip: true
  picard/rrbs_metrics:
    skip: true
  picard/sam_file_validation:
    skip: true
  picard/variant_calling_metrics:
    skip: true
  picard/wgs_metrics:
    skip: true

custom_data:
  mm_fragment_usability:
    section_name: "Quantitative fragment usability"
    description: >
      Fragment-level mapping outcome after multimapper handling. The acceptance metric is the fraction of STAR input fragments
      that actually enter the quantitative BAM: trusted unique plus globally expected-FDR-resolved multimappers. With
      --skip_em true, the quantitative BAM is trusted-unique-only and multimappers contribute zero usable mass.
    plot_type: "table"
    pconfig:
      id: "mm_fragment_usability_table"
      table_title: "Fragment-level quantitative usability"
      namespace: "Quantitative fragments"
      col1_header: "Sample"
    headers:
      "Input fragments":
        format: "{:,.0f}"
        hidden: true
      "STAR unique (%)":
        format: "{:,.2f}"
        suffix: "%"
        min: 0
        max: 100
      "STAR multiple loci (%)":
        format: "{:,.2f}"
        suffix: "%"
        min: 0
        max: 100
      "STAR too many loci (%)":
        format: "{:,.2f}"
        suffix: "%"
        min: 0
        max: 100
      "Trusted unique (%)":
        format: "{:,.2f}"
        suffix: "%"
        min: 0
        max: 100
      "Eligible multimapper (%)":
        format: "{:,.2f}"
        suffix: "%"
        min: 0
        max: 100
      "Resolver retained multimapper (%)":
        format: "{:,.2f}"
        suffix: "%"
        min: 0
        max: 100
      "Unresolved multimapper (%)":
        format: "{:,.2f}"
        suffix: "%"
        min: 0
        max: 100
      "Excluded mapped (%)":
        format: "{:,.2f}"
        suffix: "%"
        min: 0
        max: 100
      "Quantitative usable (%)":
        format: "{:,.2f}"
        suffix: "%"
        min: 0
        max: 100

  mmresolver:
    section_name: "Multimapper resolver"
    description: >
      Bayesian STAR-candidate resolution at fragment level. Resolved_fdr is controlled by posterior expected FDR;
      high-confidence is the stricter per-fragment tier. BAM alignment-record counts are not fragment counts.
    plot_type: "table"
    pconfig:
      id: "mmresolver_table"
      table_title: "Bayesian multimapper resolution"
      namespace: "MM resolver"
      col1_header: "Sample"
    headers:
      achieved_expected_fdr:
        title: "Expected FDR"
        format: "{:,.4f}"
        min: 0
        max: 0.2
      target_posterior_fdr:
        title: "Target FDR"
        format: "{:,.4f}"
      resolution_fraction_of_eligible_multimappers:
        title: "Resolved fraction"
        format: "{:,.3f}"
        min: 0
        max: 1
      highconf_fraction_of_resolved:
        title: "High-conf / resolved"
        format: "{:,.3f}"
        min: 0
        max: 1
      median_pmax:
        title: "Median pmax"
        format: "{:,.3f}"
        min: 0
        max: 1
      median_entropy:
        title: "Median entropy"
        format: "{:,.3f}"
      equal_best_as_fraction:
        title: "Equal-best AS fraction"
        format: "{:,.3f}"
        min: 0
        max: 1
      knn_boundary_hit_any:
        title: "k boundary hit"
        format: "{:,.0f}"
      max_selected_knn_mass:
        title: "Max selected k"
        format: "{:,.0f}"
      max_selected_p95_cv_radius_bp:
        title: "Max p95 radius (bp)"
        format: "{:,.0f}"

  mmdensity:
    section_name: "Multimapper density bandwidth"
    description: >
      Sample- and observed-orientation-specific adaptive unique-anchor density fit. Boundary hit = 1 means selected k equals
      the largest k currently tested; this is a diagnostic, not a failure or an automatic reason to expand the grid.
    plot_type: "table"
    pconfig:
      id: "mmdensity_table"
      table_title: "Adaptive density bandwidth by sample and orientation"
      namespace: "MM density"
      col1_header: "Sample-orientation"
    headers:
      "Unique anchor weight":
        format: "{:,.0f}"
      "Background density / bp":
        format: "{:,.6g}"
      "Selected k":
        format: "{:,.0f}"
      "Search max k":
        format: "{:,.0f}"
      "Boundary hit":
        format: "{:,.0f}"
      "CV log-likelihood":
        format: "{:,.4f}"
      "Gain vs previous k":
        format: "{:,.4f}"
      "Median CV radius (bp)":
        format: "{:,.0f}"
      "P95 CV radius (bp)":
        format: "{:,.0f}"
      "Absolute normalized AS cutoff":
        format: "{:,.4f}"

  fail_trimmed_samples:
    section_name: "WARNING: Fail Trimming Check"
    description: "Samples below --min_trimmed_reads and excluded from downstream processing."
    plot_type: "table"
    pconfig:
      id: "fail_trimmed_samples_table"
      table_title: "Samples failed trimming threshold"
      namespace: "Samples failed trimming threshold"
      format: "{:,.0f}"

  fail_mapped_samples:
    section_name: "WARNING: Fail Quantitative Usability Check"
    description: >
      Samples below --min_mapped_reads after multimapper handling. The threshold is applied to quantitative usable fragments,
      not STAR unique mapping alone.
    plot_type: "table"
    pconfig:
      id: "fail_mapped_samples_table"
      table_title: "Samples failed quantitative usability threshold"
      namespace: "Samples failed quantitative usability threshold"

  strand_qc:
    section_name: "Strandedness QC"
    description: >
      RSeQC infer_experiment validation against the strandedness supplied in the sample sheet.
      A missing or malformed inference, including zero usable sampled reads, is reported as INDETERMINATE
      and is never converted into a biological call of unstrandedness.
    plot_type: "table"
    pconfig:
      id: "strand_qc_table"
      table_title: "RSeQC strandedness validation"
      namespace: "Strandedness QC"
      col1_header: "Sample"
    headers:
      "Provided strandedness":
        title: "Provided"
      "Inference status":
        title: "RSeQC status"
      "Check":
        title: "Check"
      "Inferred strandedness":
        title: "Inferred"
      "Sense (%)":
        title: "Sense (%)"
        format: "{:,.2f}"
        suffix: "%"
        min: 0
        max: 100
      "Antisense (%)":
        title: "Antisense (%)"
        format: "{:,.2f}"
        suffix: "%"
        min: 0
        max: 100
      "Undetermined (%)":
        title: "Undetermined (%)"
        format: "{:,.2f}"
        suffix: "%"
        min: 0
        max: 100
      "Usable reads":
        title: "Usable reads"
        format: "{:,.0f}"
      "Reason":
        title: "Reason"
